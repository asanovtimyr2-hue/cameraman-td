<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cameraman Tower Defense</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--panel:#151a24;--panel2:#1c2230;--line:#2a3242;--txt:#e8edf5;--dim:#8b96a8;--acc:#38bdf8;--coin:#ffd23f;--gem:#c084fc;--elo:#5eead4}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 70% -10%,#16202f 0%,var(--bg) 60%);color:var(--txt);font:14px/1.45 'Segoe UI',system-ui,sans-serif;user-select:none}
#bg{position:fixed;inset:0;z-index:-1;opacity:.55}
.hidden{display:none!important}
.screen{min-height:100vh;position:relative}
.wrap{max-width:1180px;margin:0 auto;padding:14px;position:relative}
h1{font-size:26px;letter-spacing:.5px}
h2{font-size:17px;margin-bottom:10px;color:var(--acc)}
.sub{color:var(--dim);font-size:12px}
.panel{background:rgba(21,26,36,.92);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:rgba(21,26,36,.95);border:1px solid var(--line);border-radius:14px;padding:10px 16px;margin-bottom:12px}
.topbar .logo{font-weight:700;font-size:16px}
.topbar .logo span{color:var(--acc)}
.bal{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600}
.bal small{color:var(--dim);font-weight:400}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#08121c}
.btn.primary:hover{filter:brightness(1.12);color:#08121c}
.btn.danger{border-color:#7f1d3a}
.btn.mini{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.big{padding:14px 18px;font-size:15px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabbtn{flex:1;min-width:110px;padding:10px;background:rgba(21,26,36,.9);border:1px solid var(--line);border-radius:12px;color:var(--dim);font-weight:700;font-size:13px;cursor:pointer;transition:.15s}
.tabbtn:hover{color:var(--txt)}
.tabbtn.on{color:var(--acc);border-color:var(--acc);background:rgba(28,34,48,.95)}
.tabpane{display:none}
.tabpane.on{display:block}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mapcard{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;transition:.15s}
.mapcard:hover{border-color:#3d4a60}
.mapcard.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.mapcard svg{width:100%;height:auto;display:block}
.mapcard .mn{font-weight:700;text-align:center;margin-top:5px;font-size:13px}
.diffrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.diffbtn{background:var(--panel2);border:2px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;text-align:left;color:var(--txt)}
.diffbtn.sel{border-color:var(--acc)}
.diffbtn b{display:block}
.diffbtn small{color:var(--dim)}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin:3px 0}
.loadbar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.slotcard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:12px;display:flex;align-items:center;gap:6px}
.slotcard .dot{width:8px;height:8px;border-radius:50%}
.slotcard button{margin-left:2px}
.coin{color:var(--coin)}.gem{color:var(--gem)}
input[type=text]{background:#0e131c;border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:8px 10px;font:inherit;width:100%}
.row{display:flex;gap:8px;align-items:center}
/* gacha */
.gwrap{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;align-items:start}
@media(max-width:900px){.gwrap{grid-template-columns:1fr}}
#bannerBox{background:linear-gradient(135deg,#141d33 0%,#2a1636 55%,#3a1a2e 100%);border:1px solid #4a3a6a;border-radius:16px;padding:22px;text-align:center}
#bannerBox .bt{font-size:24px;font-weight:800;letter-spacing:1px;background:linear-gradient(90deg,#38bdf8,#c084fc,#ff5d8f);-webkit-background-clip:text;background-clip:text;color:transparent}
#bannerBox .bs{color:var(--dim);margin:6px 0 14px}
.gbtns{display:flex;gap:10px;justify-content:center;margin-top:14px}
.pbar{height:9px;background:#0e131c;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.pfill{height:100%;background:linear-gradient(90deg,#38bdf8,#c084fc);border-radius:99px;transition:width .4s}
.chiprow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;color:var(--dim);cursor:pointer}
.chip.on{color:var(--elo);border-color:var(--elo)}
.rates{font-size:12px;color:var(--dim);line-height:1.8}
.rates i{font-style:normal;font-weight:700}
/* inventory */
.invcard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid #999;border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:center;margin-bottom:8px}
.invcard .ico{width:44px;height:44px;border-radius:9px;background:#232b3b;display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.invcard .info{flex:1;min-width:0}
.invcard .nm{font-weight:700;display:flex;gap:8px;align-items:center}
.invcard .cnt{background:#0e131c;border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;color:var(--dim)}
.invcard .role{font-size:11px;color:var(--dim)}
.invcard .act{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.invlist{max-height:480px;overflow:auto;padding-right:4px}
.rar-Common{border-left-color:#9aa7bd}.rar-Uncommon{border-left-color:#4ade80}.rar-Rare{border-left-color:#38bdf8}.rar-Epic{border-left-color:#c084fc}.rar-Legendary{border-left-color:#fbbf24}.rar-Mythic{border-left-color:#ff5d8f}
.rar-Common .rr{color:#9aa7bd}.rar-Uncommon .rr{color:#4ade80}.rar-Rare .rr{color:#38bdf8}.rar-Epic .rr{color:#c084fc}.rar-Legendary .rr{color:#fbbf24}.rar-Mythic .rr{color:#ff5d8f}
.statline{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;border-bottom:1px dashed #232b3b}
.statline b{font-weight:700}
.side-block{margin-bottom:12px}
/* spin overlay */
#spinOv{position:fixed;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:60;gap:16px;padding:20px}
#spinBox{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:860px;width:100%}
#spinBox.single{grid-template-columns:1fr;max-width:260px}
.resCard{background:var(--panel);border:1px solid var(--line);border-left:4px solid #999;border-radius:12px;padding:14px 10px;text-align:center;animation:pop .35s backwards}
.resCard .rico{font-size:34px}
.resCard .rnm{font-weight:700;margin-top:4px;font-size:13px}
.resCard .rrar{font-size:11px;font-weight:700}
.resCard .rdup{font-size:11px;color:var(--dim);margin-top:3px}
@keyframes pop{from{transform:scale(.4);opacity:0}60%{transform:scale(1.08)}to{transform:scale(1);opacity:1}}
/* game */
#game{display:flex;flex-direction:column;height:100vh}
#hud{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#hud .hstat{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:4px 11px;font-weight:600}
#main{flex:1;display:flex;min-height:0}
#arenabox{flex:1;position:relative;background:#0d1320;min-width:0}
canvas#cv{position:absolute;inset:0;display:block}
#side{width:230px;background:var(--panel);border-left:1px solid var(--line);padding:10px;overflow:auto;flex:none}
.sidecard{background:var(--panel2);border:1px solid var(--line);border-left:4px solid #999;border-radius:9px;padding:7px 9px;margin-bottom:7px;cursor:pointer;transition:.12s}
.sidecard:hover{border-color:var(--acc)}
.sidecard.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sidecard.cant{opacity:.5}
.sidecard .nm{font-weight:700;font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
.sidecard .role{font-size:10.5px;color:var(--dim)}
#tmenu{position:absolute;background:rgba(21,26,36,.98);border:1px solid var(--acc);border-radius:12px;padding:10px;width:212px;z-index:30;box-shadow:0 10px 30px #0009}
#tmenu .tst{font-size:12px;color:var(--dim);margin:2px 0}
#tmenu .btn{width:100%;margin-top:6px;padding:6px}
#gover{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50}
#goPanel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:26px 34px;text-align:center;max-width:420px}
#goPanel h2{font-size:24px;margin-bottom:6px}
#goBody{color:var(--dim);margin:10px 0 16px;white-space:pre-line}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#1d2740;border:1px solid var(--acc);border-radius:10px;padding:8px 16px;font-weight:600;animation:tin .2s}
.toast.err{border-color:#ff5d8f}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1}}
.capnote{font-size:11px;color:var(--dim);margin:4px 0 8px}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="lobby" class="screen">
  <div class="wrap">
    <div class="topbar">
      <div class="logo">CAMERAMAN <span>TOWER DEFENSE</span></div>
      <div class="spacer"></div>
      <div class="bal">🪙 <span id="balCoins">0</span> <small id="lblCoins"></small></div>
      <div class="bal">💎 <span id="balGems">0</span> <small id="lblGems"></small></div>
      <button class="btn mini" id="btnLang">RU/EN</button>
      <button class="btn mini" id="btnSound">🔔</button>
    </div>
    <div class="tabs">
      <button class="tabbtn on" id="tabBtnPlay">🎮</button>
      <button class="tabbtn" id="tabBtnGacha">🎰</button>
      <button class="tabbtn" id="tabBtnInv">🎒</button>
      <button class="tabbtn" id="tabBtnMore">⚙️</button>
    </div>

    <div class="tabpane on" id="tabPlay">
      <div class="panel">
        <h2 id="lblPlay"></h2>
        <div class="mapgrid" id="mapGrid"></div>
        <div class="diffrow" id="diffRow"></div>
        <div id="diffInfo"></div>
        <button class="btn primary big" id="btnStart" style="width:100%"></button>
      </div>
      <div class="panel">
        <h2 id="lblLoadout"></h2>
        <div class="sub" id="slotInfo"></div>
        <div class="loadbar" id="loadBar"></div>
        <button class="btn mini" id="btnSlot"></button>
      </div>
    </div>

    <div class="tabpane" id="tabGacha">
      <div class="gwrap">
        <div id="bannerBox">
          <div class="bt" id="gTitle1"></div>
          <div class="bt" id="gTitle2" style="font-size:15px"></div>
          <div class="bs" id="gSub"></div>
          <div class="gbtns">
            <button class="btn primary big" id="btnSpin1"></button>
            <button class="btn big" id="btnSpin10"></button>
          </div>
          <div class="sub" id="gRates" style="margin-top:12px"></div>
          <div class="sub" id="gPityLbl" style="margin-top:10px"></div>
          <div class="pbar"><div class="pfill" id="gPityFill" style="width:0%"></div></div>
        </div>
        <div>
          <div class="panel">
            <h2 id="lblAuto"></h2>
            <div class="sub" id="autoHint"></div>
            <div class="chiprow" id="autoChips"></div>
          </div>
          <div class="panel">
            <h2 id="lblRate"></h2>
            <div id="rateList"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="tabpane" id="tabInv">
      <div class="panel">
        <h2 id="lblInv"></h2>
        <div class="row" style="margin-bottom:10px">
          <input type="text" id="invSearch">
        </div>
        <div class="chiprow" id="invFilters" style="margin-bottom:10px"></div>
        <div class="invlist" id="invList"></div>
      </div>
    </div>

    <div class="tabpane" id="tabMore">
      <div class="gwrap">
        <div>
          <section class="panel">
            <h2 id="lblCodes"></h2>
            <div class="sub" id="codesHint"></div>
            <div class="row" style="margin-top:8px">
              <input type="text" id="codeInput" maxlength="24">
              <button class="btn" id="btnRedeem">OK</button>
            </div>
          </section>
          <section class="panel">
            <h2 id="lblAfk"></h2>
            <div class="sub" id="afkInfo"></div>
            <button class="btn primary" id="btnAfk" style="width:100%;margin-top:8px" disabled></button>
          </section>
        </div>
        <div>
          <section class="panel">
            <h2 id="lblStats"></h2>
            <div id="statBox"></div>
          </section>
          <section class="panel">
            <h2 id="lblReset"></h2>
            <div class="sub" id="resetHint"></div>
            <button class="btn danger" id="btnReset" style="margin-top:8px"></button>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="game" class="screen hidden">
  <div id="hud">
    <button class="btn mini" id="btnQuit">←</button>
    <div class="hstat" id="hWave"></div>
    <div class="hstat" id="hCash"></div>
    <div class="hstat" id="hBase"></div>
    <div class="spacer"></div>
    <button class="btn mini" id="btnSpeed">1x</button>
    <button class="btn mini" id="btnAuto"></button>
    <button class="btn mini" id="btnPause"></button>
  </div>
  <div id="main">
    <div id="arenabox">
      <canvas id="cv"></canvas>
      <div id="tmenu" class="hidden"></div>
    </div>
    <div id="side">
      <div class="capnote" id="capNote"></div>
      <div id="sideCards"></div>
    </div>
  </div>
</div>

<div id="spinOv" class="hidden">
  <div id="spinBox"></div>
  <button class="btn primary" id="spinClose"></button>
</div>

<div id="gover" class="hidden">
  <div id="goPanel">
    <h2 id="goTitle"></h2>
    <div id="goBody"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="goHome"></button>
      <button class="btn primary" id="goAgain"></button>
    </div>
  </div>
</div>
<div id="toasts"></div>

function loadSave(){
  try{save=JSON.parse(localStorage.getItem(SAVE_KEY))||null}catch(e){save=null}

}
function persist(){localStorage.setItem(SAVE_KEY,JSON.stringify(save))}

function t(k,vars){let s=I18N[LANG][k];if(s===undefined)s=I18N.en[k]||k;
  if(vars)for(const v in vars)s=s.replace('{'+v+'}',vars[v]);return s}
function t2(k,vars){let s=I18N[LANG].tabs[k]||I18N.en.tabs[k]||k;return s}
function L(o){return LANG==='ru'&&o.ru!==undefined?o.ru:o.en}

/* ---- sound ---- */
const Snd=(()=>{
  let ctx=null;
  function beep(f,d,type,v,slide){
    if(!save||!save.sound)return;
    try{
      if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type=type||'square';o.frequency.value=f;
      if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),ctx.currentTime+d);
      g.gain.value=v||.05;g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+d);
      o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+d);
    }catch(e){}
  }
  return{
    click:()=>beep(700,.05,'square',.03),
    shot:()=>beep(220,.05,'square',.015,-120),
    boom:()=>beep(90,.18,'sawtooth',.05,-50),
    cash:()=>beep(980,.08,'sine',.04,300),
    hurt:()=>beep(140,.2,'sawtooth',.06,-60),
    rare:()=>{beep(520,.1,'sine',.05);setTimeout(()=>beep(780,.14,'sine',.05),110);setTimeout(()=>beep(1040,.2,'sine',.05),230)},
    win:()=>{beep(520,.12,'sine',.06);setTimeout(()=>beep(660,.12,'sine',.06),120);setTimeout(()=>beep(880,.2,'sine',.06),240)},
    lose:()=>{beep(300,.2,'sawtooth',.06,-100);setTimeout(()=>beep(180,.4,'sawtooth',.06,-100),200)}
  };
})();

/* ---- gacha ---- */
const SELL_PRICE={Common:20,Uncommon:45,Rare:90,Epic:180,Legendary:400,Mythic:900};
const GACHA={cost:100,cost10:950,pity:20};
const GACHA_W={Common:50,Uncommon:25,Rare:15,Epic:8,Legendary:1.5,Mythic:.5};
const GACHA_POOL={};
for(const id in UNITS){const u=UNITS[id];(GACHA_POOL[u.rar]=GACHA_POOL[u.rar]||[]).push(id)}

function rollRar(){
  let w=GACHA_W;
  if((save.pity||0)>=GACHA.pity)w={Legendary:1.5,Mythic:.5};
  const tot=Object.values(w).reduce((a,b)=>a+b,0);
  let r=Math.random()*tot;
  for(const k in w){r-=w[k];if(r<=0)return k}
  return 'Common';
}
function doGacha(n){
  const cost=n===1?GACHA.cost:GACHA.cost10;
  if(save.coins<cost){toast(t('noCoins'),true);return}
  save.coins-=cost;
  const res=[];
  for(let i=0;i<n;i++){
    save.pity=(save.pity||0)+1;
    let rar=rollRar();
    if(rar==='Epic'||rar==='Legendary'||rar==='Mythic')save.pity=0;
    else if(rar==='Rare'&&save.pity>=Math.ceil(GACHA.pity*.6))save.pity=Math.ceil(GACHA.pity*.6);
    const pool=GACHA_POOL[rar];
    const id=pool[Math.floor(Math.random()*pool.length)];
    save.inv[id]=(save.inv[id]||0)+1;
    const sold=!!save.autoSell[rar];
    if(sold)save.coins+=SELL_PRICE[rar];
    res.push({id,rar,sold});
  }
  persist();
  showSpin(res);
  renderTop();
  renderGacha();
}
function showSpin(res){
  const ov=$('spinOv'),box=$('spinBox');
  box.classList.toggle('single',res.length===1);
  box.innerHTML='';
  res.forEach((r,i)=>{
    const u=UNITS[r.id];
    const d=document.createElement('div');
    d.className='resCard rar-'+r.rar;
    d.style.animationDelay=(i*.12)+'s';
    let dup='';
    if(r.sold)dup=`<div class="rdup">→ +${SELL_PRICE[r.rar]} 🪙</div>`;
    else if(save.inv[r.id]>1)dup=`<div class="rdup">×${save.inv[r.id]} (дубль)</div>`;
    d.innerHTML=`<div class="rico">${u.ico}</div><div class="rnm">${L(u)}</div>
      <div class="rrar rr">${LANG==='ru'?RARS[r.rar].ru:r.rar}</div>${dup}`;
    box.appendChild(d);
  });
  ov.classList.remove('hidden');
  $('spinClose').textContent='OK';
  const best=res.reduce((a,r)=>['Legendary','Mythic'].includes(r.rar)&&r.rar!==a?r.rar:a,'Common');
  if(best==='Mythic'||best==='Legendary')Snd.rare();else Snd.cash();
}
function closeSpin(){$('spinOv').classList.add('hidden');renderCur()}

  $('invSearch').placeholder=t('invSearchPh');

  for(const k of ['ALL','Common','Uncommon','Rare','Epic','Legendary','Mythic']){

function bgLoop(){
  const cv=$('bg');
  if(cv.width!==innerWidth||cv.height!==innerHeight){cv.width=innerWidth;cv.height=innerHeight}
  const g=cv.getContext('2d');
  if(!bgLoop.p){

      r:1+Math.random()*2.2,v:8+Math.random()*20,h:[190,270,340][i%3]});
  }
  g.clearRect(0,0,cv.width,cv.height);
  for(const p of bgLoop.p){
    p.y-=p.v/60;if(p.y<-4){p.y=innerHeight+4;p.x=Math.random()*innerWidth}
    g.fillStyle=`hsla(${p.h},70%,65%,.25)`;
    g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();
  }
  requestAnimationFrame(bgLoop);
}
/* ============ game engine ============ */
let GT=null,uidSeq=1;
const CW=960,CH=540,CELL=60,COLS=16,ROWS=9,CAP_PLACED=15;

function startMatch(){
  const mapK=sel.map,D=DIFFS[sel.diff];
  const pts=MAPS[mapK].pts.map(p=>[p[0]*CW,p[1]*CH]);
  const segs=[];let tot=0;
  for(let i=0;i<pts.length-1;i++){
    const dx=pts[i+1][0]-pts[i][0],dy=pts[i+1][1]-pts[i][1],len=Math.hypot(dx,dy);
    segs.push({x:pts[i][0],y:pts[i][1],dx:dx/len,dy:dy/len,len,st:tot});tot+=len;
  }
  GT={mapK,diffK:sel.diff,D,map:MAPS[mapK],segs,tot,
    wave:1,cash:D.start,hp:150,hpMax:150,
    towers:[],enemies:[],bullets:[],floats:[],parts:[],
    spawnQ:[],spawnT:0,phase:'prep',cd:4,speed:1,auto:1,paused:false,over:false,
    cells:{},selTower:null,placing:null,t:0,shake:0,kills:0};
  showOnly('game');
  resizeCv();
  buildSide();
  updHud();
  requestAnimationFrame(loop);
}
function placedN(){return GT?GT.towers.filter(tw=>!tw.sentry).length:0}
function pathPos(d){
  d=Math.min(d,GT.tot);
  for(const s of GT.segs)if(d<=s.st+s.len)return{x:s.x+s.dx*(d-s.st),y:s.y+s.dy*(d-s.st)};
  const s=GT.segs[GT.segs.length-1];return{x:s.x+s.dx*s.len,y:s.y+s.dy*s.len};
}
function wEff(w){return GT.D.waves===Infinity?Math.min(50,w):Math.round(w*50/GT.D.waves)}
function isFree(cx,cy){
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return false;
  if(GT.cells[cx+','+cy])return false;
  const{x,y}=cellCenter(cx,cy);
  for(const s of GT.segs){
    const tt=Math.max(0,Math.min(s.len,(x-s.x)*s.dx+(y-s.y)*s.dy));
    const nx=s.x+s.dx*tt,ny=s.y+s.dy*tt;
    if(Math.hypot(x-nx,y-ny)<34)return false;
  }
  return true;
}
function cellCenter(cx,cy){return{x:cx*CELL+CELL/2,y:cy*CELL+CELL/2}}
function cellOf(x,y){return{cx:Math.floor(x/CELL),cy:Math.floor(y/CELL)}}
function freeCellNear(cx,cy,rad){
  for(let r=1;r<=rad;r++)
    for(let dx=-r;dx<=r;dx++)for(let dy=-r;dy<=r;dy++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
      if(isFree(cx+dx,cy+dy))return[cx+dx,cy+dy];
    }
  return null;
}

/* ---- waves ---- */
function nextWaveNow(){
  if(!GT||GT.phase!=='prep'||GT.over)return;
  const b=skipBonus();
  GT.cash+=b;
  addFloat(CW*.5,CH*.18,'+'+b,'#ffd23f');
  Snd.cash();
  startWave();
}
function startWave(){
  if(GT.over)return;
  GT.phase='wave';
  engineerDeploy();
  const w=GT.wave,D=GT.D,eff=wEff(w);
  const pool=Object.entries(ENEMIES).filter(([k,e])=>e.w<=eff).map(([k,e])=>({k,w:e.w}));
  pool.sort((a,b)=>a.w-b.w);
  const count=Math.min(36,Math.round((4+w*.35)*D.cnt));
  const q=[];
  const bias=Math.min(1,eff/50+.35);
  for(let i=0;i<count;i++){
    const idx=Math.floor(Math.pow(Math.random(),1.6-bias)*pool.length);
    q.push(pool[Math.min(pool.length-1,idx)].k);
  }
  if(w%10===0){const n=1+Math.floor(w/25);for(let i=0;i<n;i++)q.push('gtoilet')}
  if(w%25===0)q.push('gman');
  if(D.waves!==Infinity&&w===D.waves&&!q.includes('gman'))q.push('gman');
  GT.spawnQ=q;
  GT.spawnT=0;
  updHud();
}
function engineerDeploy(){
  for(const tw of GT.towers.slice()){
    const u=UNITS[tw.key];
    if(!u||!u.fx.spawnSentry||tw.lvl<3)continue;
    const mine=GT.towers.filter(s=>s.owner===tw.uid).length;
    if(mine>=3)continue;
    const spot=freeCellNear(tw.cx,tw.cy,2);
    if(!spot)continue;
    placeTower(tw.key,spot[0],spot[1],true,tw.uid);
    toast(t('sentrySpawn'));
  }
}

/* ---- placement / menu ---- */
function placeTower(key,cx,cy,sentry,owner){
  if(!sentry){
    if(GT.cash<UNITS[key].cost||placedN()>=CAP_PLACED)return null;
    const cnt=GT.towers.filter(tw=>tw.key===key&&!tw.sentry).length;
    if(cnt>=UNITS[key].limit)return null;
    GT.cash-=UNITS[key].cost;
  }
  const look=sentry?{c:'#c9a03f',h:'spk',s:.8}:UNITS[key].look;
  const tw={uid:uidSeq++,key,cx,cy,x:cellCenter(cx,cy).x,y:cellCenter(cx,cy).y,
    lvl:0,cd:0,spent:sentry?0:UNITS[key].cost,sentry:!!sentry,owner:owner||0,look:look,crit:0,flash:0};
  GT.cells[cx+','+cy]=tw.uid;
  GT.towers.push(tw);
  Snd.click();
  renderSideSel();
  return tw;
}
function showTmenu(tw){
  GT.selTower=tw;
  updTmenu();
}
function hideTmenu(){if(GT)GT.selTower=null;$('tmenu').classList.add('hidden')}
function updTmenu(){
  const tw=GT&&GT.selTower,m=$('tmenu');
  if(!tw){m.classList.add('hidden');return}
  m.classList.remove('hidden');
  const cv=$('cv'),sc=cv._s||1,ox=cv._ox||0,oy=cv._oy||0;
  m.style.left=Math.min(CW*sc-228,ox+tw.x*sc+22)+'px';
  m.style.top=Math.max(6,oy+tw.y*sc-96)+'px';
  if(tw.sentry){
    m.innerHTML=`<b>🛠️ ${t('sentryName')}</b>
      <div class="tst">DMG ${SENTRY.dmg} · RNG ${SENTRY.rng} · ${SENTRY.rate}/s</div>`;
    return;
  }
  const u=UNITS[tw.key],lvl=tw.lvl,st=towerSt(tw);
  let mid;
  if(lvl<3){
    const cost=u.upg[lvl];
    mid=`<div class="tst">LV ${lvl} → ${lvl+1} · DMG ${st.dmg} → ${u.stats.dmg[lvl+1]}</div>
      <button class="btn primary" id="tmUp" ${GT.cash<cost?'disabled':''}>${t('upgrade',{c:cost})}</button>`;
  }else{
    mid=`<div class="tst">LV ${t('max')} · DMG ${st.dmg}</div>
      <div class="tst">✦ ${t('upgradeMax')}</div>`;
  }
  m.innerHTML=`<b>${u.ico} ${L(u)}</b> <span style="color:${RARS[u.rar].c};font-size:11px">${LANG==='ru'?RARS[u.rar].ru:u.rar}</span>
    ${mid}
    <button class="btn danger" id="tmSell">${t('sell',{v:Math.floor(tw.spent*.6)})}</button>`;
  const up=$('tmUp');
  if(up)up.onclick=()=>upgradeTower(tw);
  $('tmSell').onclick=()=>sellTower(tw);
}
function towerSt(tw){
  const u=UNITS[tw.key];
  return{dmg:u.stats.dmg[tw.lvl],rng:u.stats.rng[tw.lvl],rate:u.stats.rate[tw.lvl],fx:u.fx};
}
function upgradeTower(tw){
  const u=UNITS[tw.key],cost=u.upg[tw.lvl];
  if(GT.cash<cost)return;
  GT.cash-=cost;tw.spent+=cost;tw.lvl++;
  Snd.cash();updTmenu();updHud();
}
function sellTower(tw){
  delete GT.cells[tw.cx+','+tw.cy];
  GT.towers=GT.towers.filter(x=>x!==tw);
  GT.cash+=Math.floor(tw.spent*.6);
  Snd.click();hideTmenu();renderSideSel();updHud();
}

/* ---- combat ---- */
function addFloat(x,y,txt,c){GT.floats.push({x,y,txt,c,t:.9})}
function spawnEnemy(key){
  const e=ENEMIES[key],D=GT.D,w=GT.wave;
  const hp=Math.round(e.hp*D.hp*Math.pow(1+D.grow,w-1));
  GT.enemies.push({uid:uidSeq++,key,dist:0,hp,hpMax:hp,sp:e.sp*46,cash:e.cash,dmg:e.dmg,
    r:e.r,boss:!!e.boss,regen:e.regen||0,burn:0,burnT:0,slowT:0,slowMul:1,stunT:0,c:e.c,jet:!!e.jet});
}
function fire(tw,tgt,st){
  const fx=st.fx||{};
  let dmg=st.dmg;
  if(fx.bossDmg&&tgt.boss)dmg*=fx.bossDmg;
  tgt.lastHit=tw.uid;
  tgt.hp-=dmg;
  GT.bullets.push({x1:tw.x,y1:tw.y,x2:tgt.gx,y2:tgt.gy,t:.09,c:tw.look.c});
  Snd.shot();
  const postFx=e=>{
    if(fx.burn){e.burn=fx.burn;e.burnT=3}
    if(fx.slow){e.slowT=1.5;e.slowMul=fx.slow}
    if(fx.stun&&Math.random()<fx.stun)e.stunT=1;
  };
  if(fx.splash){
    for(const e of GT.enemies){
      if(Math.hypot(e.gx-tgt.gx,e.gy-tgt.gy)<=fx.splash){
        if(e!==tgt)e.hp-=dmg*.6;
        postFx(e);
      }
    }
  }else{
    postFx(tgt);
    if(fx.pierce){
      const near=GT.enemies.filter(e=>e!==tgt&&e.hp>0&&Math.hypot(e.gx-tw.x,e.gy-tw.y)<=st.rng)
        .sort((a,b)=>a.dist-b.dist).slice(0,fx.pierce-1);
      for(const e of near){e.lastHit=tw.uid;e.hp-=dmg*.8}
    }
    if(fx.dual){
      const second=GT.enemies.find(e=>e!==tgt&&e.hp>0&&Math.hypot(e.gx-tw.x,e.gy-tw.y)<=st.rng);
      if(second){second.lastHit=tw.uid;second.hp-=dmg;GT.bullets.push({x1:tw.x,y1:tw.y,x2:second.gx,y2:second.gy,t:.09,c:tw.look.c})}
    }
  }
  tw.flash=.08;
}
function rateOf(tw){
  const st=towerSt(tw);
  let r=st.rate;
  for(const o of GT.towers){
    const ou=UNITS[o.key];
    if(o!==tw&&ou&&ou.fx.aura&&o.lvl>=1&&Math.hypot(o.x-tw.x,o.y-tw.y)<=120)r*=1+ou.fx.aura;
  }
  return r;
}
function killCheck(){
  for(let i=GT.enemies.length-1;i>=0;i--){
    const e=GT.enemies[i];
    if(e.hp<=0){
      let c=e.cash*GT.D.cash;
      const tw=GT.towers.find(t2=>t2.uid===e.lastHit);
      if(tw&&!tw.sentry){const fx=UNITS[tw.key].fx;if(fx&&fx.cash)c*=fx.cash}
      c=Math.round(c);
      GT.cash+=c;
      addFloat(e.gx,e.gy,'+'+c,'#ffd23f');
      GT.kills++;
      for(let p=0;p<4;p++)GT.parts.push({x:e.gx,y:e.gy,vx:(Math.random()-.5)*80,vy:(Math.random()-.5)*80,t:.4,c:e.c,r:3});
      GT.enemies.splice(i,1);
    }
  }
}
function leak(e){
  GT.hp-=e.dmg;GT.shake=6;Snd.hurt();
  addFloat(e.gx,e.gy,'-'+e.dmg,'#ff5d8f');
  if(GT.hp<=0)defeat();
}
function waveEnd(){
  const D=GT.D;
  let bonus=18+GT.wave*4;
  for(const tw of GT.towers){
    const fx=UNITS[tw.key]&&UNITS[tw.key].fx;
    if(!tw.sentry&&fx&&fx.income){
      const inc=fx.income[tw.lvl];
      GT.cash+=inc;addFloat(tw.x,tw.y,'+'+inc,'#5eead4');
    }
  }
  GT.cash+=bonus;
  if(D.waves!==Infinity&&GT.wave>=D.waves){victory();return}
  GT.wave++;
  GT.phase='prep';GT.cd=6;
  Snd.cash();
  updHud();
}
function victory(){
  GT.over=true;
  hideTmenu();
  save.stats.kills+=GT.kills;
  const D=GT.D,key=GT.mapK+'_'+GT.diffK;
  let coins=D.reward,g=0,msg=t('rewardWin',{c:coins});
  if(!save.firstWins[key]){save.firstWins[key]=1;g=2;msg+='\n'+t('rewardFirst',{g:2})}
  save.coins+=coins;save.gems+=g;save.stats.wins++;
  persist();
  showResult(true,msg);Snd.win();
}
function defeat(){
  if(GT.over)return;
  GT.over=true;
  hideTmenu();
  save.stats.kills+=GT.kills;
  const D=GT.D;
  let coins,g=0,msg;
  if(D.waves===Infinity){
    coins=20+GT.wave*6;
    msg=t('endlessRec',{w:GT.wave});
    for(const[mw,gm]of[[25,3],[40,5],[60,8]]){
      const mk='endless_'+mw;
      if(GT.wave>=mw&&!save.firstWins[mk]){save.firstWins[mk]=1;g+=gm;msg+='\n+'+gm+' 💎'}
    }
    if(GT.wave>save.stats.bestEndless)save.stats.bestEndless=GT.wave;
    msg+='\n'+t('rewardLose',{c:coins});
  }else{
    coins=25+GT.wave*4;
    msg=t('rewardLose',{c:coins});
  }
  save.coins+=coins;save.gems+=g;
  persist();
  showResult(false,msg);Snd.lose();
}
function showResult(win,msg){
  $('goTitle').textContent=win?t('victory'):t('defeat');
  $('goTitle').style.color=win?'#5eead4':'#ff5d8f';
  $('goBody').textContent=msg+'\n'+t('kills',{k:GT.kills});
  $('gover').classList.remove('hidden');
  $('goHome').textContent=t('goHome');
  $('goAgain').textContent=t('goAgain');
}
function goHome(){
  hideTmenu();
  $('gover').classList.add('hidden');
  GT=null;
  renderLobby();
  showOnly('lobby');
}
/* ============ update / render / boot ============ */
let lastTs=0,mouse={x:0,y:0,on:false};
function loop(ts){
  const dt=Math.min(.05,(ts-lastTs)/1000||0);
  lastTs=ts;
  if(GT){
    if(!GT.paused&&!GT.over)update(dt*GT.speed);
    draw();
  }
  requestAnimationFrame(loop);
}
function update(dt){
  GT.t+=dt;
  const D=GT.D;
  if(GT.phase==='prep'){
    GT.cd-=dt;
    if(GT.auto&&GT.cd<=0)startWave();
  }else{
    GT.spawnT-=dt;
    const iv=Math.max(.18,.75-(GT.wave*.012));
    while(GT.spawnQ.length&&GT.spawnT<=0){
      spawnEnemy(GT.spawnQ.shift());
      GT.spawnT=iv;
    }
  }
  for(let i=GT.enemies.length-1;i>=0;i--){
    const e=GT.enemies[i];
    if(e.burnT>0){e.hp-=e.burn*dt;e.burnT-=dt}
    if(e.regen&&e.hp<e.hpMax)e.hp=Math.min(e.hpMax,e.hp+e.regen*dt);
    if(e.slowT>0)e.slowT-=dt;
    if(e.stunT>0){e.stunT-=dt}
    else{
      const mul=e.slowT>0?e.slowMul:1;
      e.dist+=e.sp*dt*mul;
      if(e.dist>=GT.tot){leak(e);GT.enemies.splice(i,1);continue}
    }
    const p=pathPos(e.dist);e.gx=p.x;e.gy=p.y;
  }
  for(const tw of GT.towers){
    tw.cd-=dt;
    if(tw.flash>0)tw.flash-=dt;
    if(tw.cd>0)continue;
    const st=tw.sentry?{dmg:SENTRY.dmg,rng:SENTRY.rng,rate:SENTRY.rate,fx:{}}:towerSt(tw);
    if(st.dmg<=0)continue;
    let tgt=null,best=-1;
    for(const e of GT.enemies){
      const d2=Math.hypot(e.gx-tw.x,e.gy-tw.y);
      if(d2<=st.rng&&e.dist>best){best=e.dist;tgt=e}
    }
    if(tgt){fire(tw,tgt,st);tw.cd=1/rateOf(tw)}
    else tw.cd=0;
  }
  for(let i=GT.bullets.length-1;i>=0;i--){GT.bullets[i].t-=dt;if(GT.bullets[i].t<=0)GT.bullets.splice(i,1)}
  for(let i=GT.floats.length-1;i>=0;i--){const f=GT.floats[i];f.t-=dt;f.y-=30*dt;if(f.t<=0)GT.floats.splice(i,1)}
  for(let i=GT.parts.length-1;i>=0;i--){const p=GT.parts[i];p.t-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t<=0)GT.parts.splice(i,1)}
  if(GT.shake>0)GT.shake-=dt*20;
  killCheck();
  if(GT.phase==='wave'&&!GT.spawnQ.length&&!GT.enemies.length&&!GT.over)waveEnd();
  updHud();
}
/* ---- canvas ---- */
function resizeCv(){
  const cv=$('cv'),box=$('arenabox');
  const bw=box.clientWidth||960,bh=box.clientHeight||540;
  const s=Math.min(bw/CW,bh/CH);
  cv.style.width=CW*s+'px';cv.style.height=CH*s+'px';
  cv.style.position='absolute';
  cv.style.left=(bw-CW*s)/2+'px';cv.style.top=(bh-CH*s)/2+'px';
  cv._s=s;cv._ox=(bw-CW*s)/2;cv._oy=(bh-CH*s)/2;
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=CW*dpr;cv.height=CH*dpr;
  cv._dpr=dpr;
}
function gameXY(ev){
  const cv=$('cv'),r=cv.getBoundingClientRect();
  return{x:(ev.clientX-r.left)/r.width*CW,y:(ev.clientY-r.top)/r.height*CH};
}
/* ---- draw ---- */
function draw(){
  const cv=$('cv'),g=cv.getContext('2d');
  g.setTransform(cv._dpr,0,0,cv._dpr,0,0);
  if(GT.shake>0)g.translate((Math.random()-.5)*GT.shake,(Math.random()-.5)*GT.shake);
  g.fillStyle=GT.map.bg;g.fillRect(-8,-8,CW+16,CH+16);
  g.strokeStyle='rgba(255,255,255,.03)';g.lineWidth=1;
  for(let i=1;i<COLS;i++){g.beginPath();g.moveTo(i*CELL,0);g.lineTo(i*CELL,CH);g.stroke()}
  for(let j=1;j<ROWS;j++){g.beginPath();g.moveTo(0,j*CELL);g.lineTo(CW,j*CELL);g.stroke()}
  g.lineCap='round';g.lineJoin='round';
  g.strokeStyle=GT.map.deco;g.lineWidth=38;strokePath(g);
  g.strokeStyle=GT.map.path;g.lineWidth=30;strokePath(g);
  g.strokeStyle='rgba(255,255,255,.10)';g.lineWidth=22;g.setLineDash([10,14]);strokePath(g);g.setLineDash([]);
  drawEnds(g);
  if(GT.placing&&mouse.on){
    const{cx,cy}=cellOf(mouse.x,mouse.y);
    const free=isFree(cx,cy)&&GT.cash>=UNITS[GT.placing].cost&&placedN()<CAP_PLACED;
    const{x,y}=cellCenter(cx,cy);
    g.globalAlpha=.5;
    g.fillStyle=free?'#4ade80':'#ff5d8f';
    g.beginPath();g.arc(x,y,20,0,7);g.fill();
    const u=UNITS[GT.placing];
    g.strokeStyle=free?'#4ade8088':'#ff5d8f88';g.lineWidth=2;
    g.beginPath();g.arc(x,y,u.stats.rng[0]*(CELL/52),0,7);g.stroke();
    g.globalAlpha=1;
  }
  for(const tw of GT.towers)drawFigure(g,tw);
  if(GT.selTower){
    const tw=GT.selTower,st=tw.sentry?{rng:SENTRY.rng}:towerSt(tw);
    g.strokeStyle='#38bdf8';g.lineWidth=1.5;g.globalAlpha=.7;
    g.beginPath();g.arc(tw.x,tw.y,st.rng*(CELL/52),0,7);g.stroke();g.globalAlpha=1;
  }
  for(const e of GT.enemies)drawToilet(g,e);
  for(const b of GT.bullets){
    g.strokeStyle=b.c;g.globalAlpha=Math.min(1,b.t/.09);g.lineWidth=2.5;
    g.beginPath();g.moveTo(b.x1,b.y1);g.lineTo(b.x2,b.y2);g.stroke();g.globalAlpha=1;
  }
  for(const p of GT.parts){
    g.globalAlpha=p.t/.4;g.fillStyle=p.c;
    g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();g.globalAlpha=1;
  }
  g.font='bold 13px Segoe UI';g.textAlign='center';
  for(const f of GT.floats){
    g.globalAlpha=Math.min(1,f.t/.5);g.fillStyle=f.c;
    g.fillText(f.txt,f.x,f.y);g.globalAlpha=1;
  }
  g.textAlign='left';
}
function strokePath(g){
  g.beginPath();
  g.moveTo(GT.segs[0].x,GT.segs[0].y);
  for(const s of GT.segs)g.lineTo(s.x+s.dx*s.len,s.y+s.dy*s.len);
  g.stroke();
}
function drawEnds(g){
  const st=GT.segs[0],en=GT.segs[GT.segs.length-1];
  const ex=en.x+en.dx*en.len,ey=en.y+en.dy*en.len;
  g.fillStyle='#38bdf8';g.globalAlpha=.25;
  g.beginPath();g.arc(st.x,st.y,26,0,7);g.fill();g.globalAlpha=1;
  g.fillStyle='#1d2740';g.strokeStyle='#38bdf8';g.lineWidth=2;
  roundRect(g,ex-24,ey-20,48,40,8);g.fill();g.stroke();
  g.fillStyle='#e8edf5';g.fillRect(ex-12,ey-9,20,14);
  g.beginPath();g.arc(ex+2,ey-2,5,0,7);g.stroke();
}
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function drawFigure(g,tw){
  const s=(tw.look.s||1)*1.05;
  const bob=tw.sentry?0:Math.sin(GT.t*3+tw.uid)*1.5;
  const x=tw.x,y=tw.y+bob;
  const u=UNITS[tw.key];
  if(u&&u.fx&&u.fx.aura){
    g.strokeStyle='rgba(208,111,168,.3)';g.lineWidth=2;
    g.beginPath();g.arc(tw.x,tw.y,120,0,7);g.stroke();
  }
  g.fillStyle='rgba(0,0,0,.35)';
  g.beginPath();g.ellipse(tw.x,tw.y+17,13*s,4*s,0,0,7);g.fill();
  if(tw.sentry){
    g.fillStyle='#c9a03f';roundRect(g,x-9,y-10,18,20,4);g.fill();
    g.fillStyle='#20293a';roundRect(g,x-6,y-7,12,10,3);g.fill();
    g.fillStyle='#7ec8ff';g.beginPath();g.arc(x,y-12,3,0,7);g.fill();
    return;
  }
  g.fillStyle='#141a26';
  roundRect(g,x-14*s,y-18*s,28*s,34*s,7*s);g.fill();
  g.fillStyle=tw.look.c;
  roundRect(g,x-12*s,y-16*s,24*s,30*s,6*s);g.fill();
  g.fillStyle='rgba(255,255,255,.14)';
  roundRect(g,x-12*s,y-16*s,24*s,10*s,6*s);g.fill();
  if(tw.look.flame){
    g.fillStyle='#ffb347';
    g.beginPath();g.moveTo(x-4,y+14*s);g.lineTo(x+4,y+14*s);g.lineTo(x,y+24*s);g.closePath();g.fill();
  }
  if(tw.look.h==='cam'){
    g.fillStyle='#141a26';roundRect(g,x-10*s,y-26*s,20*s,12*s,3);g.fill();
    g.fillStyle='#7ec8ff';g.beginPath();g.arc(x+11*s,y-20*s,4*s,0,7);g.fill();
    g.fillStyle='#dff4ff';g.beginPath();g.arc(x+11*s,y-20*s,1.6*s,0,7);g.fill();
    g.fillStyle='#141a26';g.fillRect(x+8*s,y-19*s,14*s,3);
  }else if(tw.look.h==='tv'){
    g.fillStyle='#141a26';roundRect(g,x-11*s,y-28*s,22*s,16*s,3);g.fill();
    g.fillStyle=tw.flash>0?'#fff':'#9fe8ff';roundRect(g,x-8*s,y-25*s,16*s,10*s,2);g.fill();
    g.fillStyle='#141a26';g.fillRect(x-2,y-30*s,4,6*s);
  }else if(tw.look.h==='spk'){
    g.fillStyle='#141a26';roundRect(g,x-10*s,y-28*s,20*s,16*s,3);g.fill();
    g.fillStyle='#222a3a';g.beginPath();g.arc(x,y-20*s,6*s,0,7);g.fill();
    g.fillStyle=tw.flash>0?'#fff':'#e8edf5';g.beginPath();g.arc(x,y-20*s,3*s,0,7);g.fill();
  }else if(tw.look.h==='spider'){
    g.strokeStyle='#141a26';g.lineWidth=2.5*s;
    for(let i=0;i<4;i++){
      g.beginPath();g.moveTo(x,y-8*s);
      g.lineTo(x-18*s,y-2+i*5);g.moveTo(x,y-8*s);
      g.lineTo(x+18*s,y-2+i*5);g.stroke();
    }
    g.fillStyle='#141a26';roundRect(g,x-9*s,y-16*s,18*s,12*s,3);g.fill();
    g.fillStyle=tw.flash>0?'#fff':'#63e0ff';roundRect(g,x-6*s,y-13*s,12*s,7*s,2);g.fill();
  }
  if(tw.flash>0){
    g.globalAlpha=.4;g.fillStyle='#fff';
    roundRect(g,x-12*s,y-16*s,24*s,30*s,6*s);g.fill();g.globalAlpha=1;
  }
  g.fillStyle='#0d1117';
  for(let i=0;i<=tw.lvl;i++){
    g.beginPath();g.arc(x-8+i*8,y+18,3,0,7);g.fill();
  }
}
function drawToilet(g,e){
  const wob=Math.sin(GT.t*6+e.uid)*2;
  const x=e.gx,y=e.gy,jet=e.jet,sc=e.r/14;
  if(jet){
    g.fillStyle='#8fd0ff';
    g.beginPath();g.moveTo(x-16,y+6);g.lineTo(x-28,y+9);g.lineTo(x-16,y+14);g.closePath();g.fill();
  }
  g.fillStyle='rgba(0,0,0,.3)';
  g.beginPath();g.ellipse(x,y+10*sc,12*sc,3,0,0,7);g.fill();
  g.save();
  g.translate(x,y);g.rotate(wob*.04);g.translate(-x,-y);
  g.fillStyle=e.c;
  g.beginPath();g.ellipse(x,y+4,13*sc,10*sc,0,0,7);g.fill();
  g.strokeStyle='#141a26';g.lineWidth=2;g.stroke();
  g.fillStyle='#f2f0ea';
  g.beginPath();g.ellipse(x,y+2,11*sc,6*sc,0,0,7);g.fill();
  g.fillStyle='#d9c9a8';
  g.beginPath();g.arc(x,y-8*sc,8*sc,0,7);g.fill();
  g.fillStyle='#fff';
  g.beginPath();g.arc(x-3*sc,y-9*sc,2.2,0,7);g.arc(x+3*sc,y-9*sc,2.2,0,7);g.fill();
  g.fillStyle='#141a26';
  g.beginPath();g.arc(x-3*sc+.5,y-9*sc,1.1,0,7);g.arc(x+3*sc+.5,y-9*sc,1.1,0,7);g.fill();
  g.strokeStyle=e.boss?'#ff5d8f':'#3a2f22';g.lineWidth=2.5;
  g.beginPath();g.arc(x,y-14*sc,8*sc,Math.PI,0);g.stroke();
  g.restore();
  if(e.boss){
    g.fillStyle='#ffd23f';
    g.beginPath();g.moveTo(x-8*sc,y-16*sc);g.lineTo(x-4*sc,y-25*sc);g.lineTo(x,y-16*sc);g.lineTo(x+4*sc,y-25*sc);g.lineTo(x+8*sc,y-16*sc);g.closePath();g.fill();
  }
  if(e.stunT>0){
    g.fillStyle='#ffd23f';g.font='10px Segoe UI';g.textAlign='center';
    g.fillText('✦',x,y-26*sc);g.textAlign='left';
  }
  if(e.burnT>0){
    g.fillStyle='#ff8c42';
    g.beginPath();g.arc(x+Math.random()*8-4,y-4,3,0,7);g.fill();
  }
  const w=26*sc,pct=Math.max(0,e.hp/e.hpMax);
  g.fillStyle='#141a26';g.fillRect(x-w/2,y-22*sc,w,4);
  g.fillStyle=pct>.5?'#5eead4':pct>.25?'#fbbf24':'#ff5d8f';
  g.fillRect(x-w/2,y-22*sc,w*pct,4);
}

  $('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')redeemCode()});
  $('btnReset').onclick=resetAll;
  $('btnQuit').onclick=()=>{Snd.click();goHome()};
  $('btnSpeed').onclick=()=>{if(!GT)return;GT.speed=GT.speed===1?2:1;Snd.click();updHud()};
  $('btnAuto').onclick=()=>{if(!GT)return;GT.auto=GT.auto?0:1;Snd.click();updHud()};
  $('btnPause').onclick=()=>{if(!GT)return;GT.paused=!GT.paused;Snd.click();updHud()};
  $('goHome').onclick=()=>{Snd.click();goHome()};
  $('goAgain').onclick=()=>{Snd.click();$('gover').classList.add('hidden');startMatch()};
  const cv=$('cv');
  cv.addEventListener('mousemove',e=>{mouse=gameXY(e);mouse.on=true});
  cv.addEventListener('mouseleave',()=>{mouse.on=false});
  cv.addEventListener('click',e=>{
    if(!GT||GT.over)return;
    const{x,y}=gameXY(e);
    if(GT.placing){
      const{cx,cy}=cellOf(x,y);
      if(isFree(cx,cy)){
        const tw=placeTower(GT.placing,cx,cy);
        if(tw&&(UNITS[GT.placing].limit===1||placedN()>=CAP_PLACED))GT.placing=null;
        updHud();
      }else{
        const tw=GT.towers.find(t2=>Math.hypot(t2.x-x,t2.y-y)<26);
        if(tw)showTmenu(tw);else{GT.placing=null;hideTmenu();renderSideSel()}
      }
    }else{
      const tw=GT.towers.find(t2=>Math.hypot(t2.x-x,t2.y-y)<26);
      if(tw)showTmenu(tw);else hideTmenu();
    }
  });
  window.addEventListener('resize',()=>{if(GT)resizeCv()});
  document.addEventListener('keydown',e=>{
    if(!GT||GT.over)return;
    if(e.key==='Escape'){GT.placing=null;hideTmenu();renderSideSel()}
    if(e.key==='n'||e.key==='т')nextWaveNow();
    if(e.key==='p'||e.key==='з')$('btnPause').click();
  });
  bgLoop();
  renderLobby();
}
initGame();
</script>
</body>
</html>
